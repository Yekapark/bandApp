# 운영용 compose. 단일 VM 에서 아래처럼 띄운다(스크립트: deploy/deploy.sh).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# 로컬 개발용 docker-compose.yml 과의 차이:
#   - app 이미지를 GHCR 에서 받아 온다(VM 에서 빌드하지 않는다 — 소형 VM 에서 gradle 빌드는 OOM 난다)
#   - postgres·redis·app 포트를 호스트에 게시하지 않는다. 컨테이너 네트워크 안에서만 닿는다
#   - redis 에 requirepass 를 건다
#   - SPRING_PROFILES_ACTIVE=prod (springdoc off, actuator 상세 off, XFF 프록시 신뢰)
#   - nginx + certbot 이 붙는다

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # VM 의 루프백에만 연다. 0.0.0.0 이 아니라 127.0.0.1 이므로 밖에서는 닿지 않고
    # (방화벽과 무관하게 커널이 막는다), SSH 로 들어온 사람만 쓸 수 있다.
    # DB 도구(HeidiSQL·DBeaver)를 SSH 터널로 붙이려면 이 줄이 필요하다 - docs/OPERATIONS.md.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 리프레시 토큰·차단목록이 들어 있다. 비밀번호 없이 띄우지 않는다.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  app:
    image: ${APP_IMAGE:-ghcr.io/yekapark/bandapp}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAKAO_APP_ID: ${KAKAO_APP_ID:-}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # 메일(SMTP)·신고 알림. 여기 없으면 .env.prod 에 값이 있어도 컨테이너에 안 실려
      # EmailSender.isConfigured() 가 false → 신고·비밀번호 재설정·이메일 인증 메일이 전부 no-op.
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-smtp.gmail.com}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_SMTP_SSL: ${MAIL_SMTP_SSL:-false}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      REPORT_NOTIFY_USER_IDS: ${REPORT_NOTIFY_USER_IDS:-}
      REPORT_NOTIFY_EMAILS: ${REPORT_NOTIFY_EMAILS:-}
      # 인앱결제(Play Billing). 여기 없으면 .env.prod 에 값이 있어도 컨테이너에 안 실려
      # app.plan.billing.gateway 가 기본값 noop 으로 뜬다 — NoOpStoreBillingGateway 는
      # 아무 구매 토큰이나 ACTIVE 로 통과시키므로 밴드장이 결제 없이 PREMIUM 을 얻는다.
      # (MAIL_* 가 안 넘어가 메일이 전부 no-op 이던 것과 같은 함정이다.)
      PLAN_BILLING_GATEWAY: ${PLAN_BILLING_GATEWAY:-noop}
      PLAN_BILLING_WEBHOOK_SECRET: ${PLAN_BILLING_WEBHOOK_SECRET:-}
      PLAN_BILLING_GOOGLE_PACKAGE: ${PLAN_BILLING_GOOGLE_PACKAGE:-}
      PLAN_BILLING_GOOGLE_CREDENTIALS_PATH: ${PLAN_BILLING_GOOGLE_CREDENTIALS_PATH:-}
      PLAN_BILLING_PUBSUB_AUDIENCE: ${PLAN_BILLING_PUBSUB_AUDIENCE:-}
      PLAN_BILLING_PUBSUB_SA: ${PLAN_BILLING_PUBSUB_SA:-}
      DEEPLINK_BASE_URL: https://${DOMAIN}
      DEEPLINK_SCHEME: ${DEEPLINK_SCHEME:-bandapp}
      IOS_APP_ID: ${IOS_APP_ID:-}
      IOS_APP_STORE_URL: ${IOS_APP_STORE_URL:-}
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-}
      ANDROID_PLAY_STORE_URL: ${ANDROID_PLAY_STORE_URL:-}
      ANDROID_SHA256_CERT_FINGERPRINTS: ${ANDROID_SHA256_CERT_FINGERPRINTS:-}
    volumes:
      - ${FCM_CREDENTIALS_HOST_PATH:-/dev/null}:/run/secrets/fcm-credentials.json:ro
      # Play Developer API 서비스 계정 키. FCM 키와 같은 방식으로 호스트 파일을 읽기전용 마운트한다.
      # 이 줄이 없으면 PLAN_BILLING_GOOGLE_CREDENTIALS_PATH 를 채워도 컨테이너 안에 파일이 없어
      # gateway=google 이 기동에 실패한다.
      - ${PLAY_SA_HOST_PATH:-/dev/null}:/run/secrets/play-developer-sa.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # $host·$scheme 같은 nginx 변수까지 치환되지 않도록 DOMAIN 만 대상으로 제한한다.
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$"
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
      - ./deploy/nginx/cloudflare-realip.conf:/etc/nginx/cloudflare-realip.conf:ro
      # 인증서 갱신분을 집어 들게 6시간마다 reload 하는 스크립트.
      # command 를 덮어쓰면 안 된다 — 공식 이미지는 명령이 nginx 로 시작할 때만
      # 이 디렉터리와 템플릿 치환을 돌린다(99-cert-reload.sh 주석 참조).
      - ./deploy/nginx/docker-entrypoint.d/99-cert-reload.sh:/docker-entrypoint.d/99-cert-reload.sh:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # 최초 발급은 deploy/init-letsencrypt.sh 가 한다. 이 컨테이너는 갱신만 맡는다.
    # certbot renew 는 만료 30일 전부터만 실제로 갱신하므로 12시간마다 돌려도 레이트리밋에 안 걸린다.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"

volumes:
  pgdata:
  redisdata:
  certbot-conf:
  certbot-www:
