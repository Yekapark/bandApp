name: bandapp_client
description: 밴드 합주 관리 앱 Flutter 클라이언트
publish_to: "none"
version: 1.0.0+43
environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 한국어 로케일 (날짜/시간 피커 등 Material 위젯 번역)
  flutter_localizations:
    sdk: flutter

  # 상태관리
  flutter_riverpod: ^2.5.1

  # 라우팅
  go_router: ^14.2.7

  # 네트워크
  dio: ^5.7.0

  # 카카오 로그인 (user 모듈만 — 로그인 + 사용자 조회). 네이티브 앱 키 필요.
  # 2.x: AGP 9 Built-in Kotlin 지원(1.x 는 KGP 를 직접 적용해 향후 Flutter 에서 빌드 실패 — LAUNCH_REVIEW U7).
  # v1→v2 변경: KakaoSdk.init 이 async, 로그인 리다이렉트 액티비티 이름(AndroidManifest).
  kakao_flutter_sdk_user: ^2.0.1

  # 게시판 첨부: 사진/영상 선택 → R2 presigned URL 로 직접 업로드.
  image_picker: ^1.1.2

  # 게시판 영상 첨부 재생. 컨트롤은 이 패키지의 VideoProgressIndicator 로 충분해서
  # chewie 같은 UI 패키지는 더 붙이지 않는다.
  video_player: ^2.9.2

  # 업로드 전 영상 압축. 폰 기본 촬영(1080p 17Mbps)은 6분이면 700MB 를 넘어 상한(200MB)에
  # 들어가지 않는다. 720p 로 줄이면 6분이 대략 90MB. Android/iOS 전용이라 웹은 원본 그대로.
  # 2026-09-29 video_compress 에서 교체(사용자 승인, LAUNCH_REVIEW U7) — video_compress 는 2025-02 이후
  # 방치돼 KGP 를 직접 적용하고(향후 Flutter 빌드 실패), 트랜스코더가 특정 영상에서 교착했다(U6).
  # 이건 Android Media3 Transformer(하드웨어 인코더)·iOS AVFoundation 을 쓰고 Built-in Kotlin 을 지원한다. MIT.
  v_video_compressor: ^2.2.3

  # 앱 시작 때 선택기 복사본을 지우려고 캐시 폴더 위치를 얻는다(U60 후속, 2026-10-09 사용자 승인).
  # 이미 다른 패키지를 통해 들어와 있던 것을 직접 의존성으로 올렸을 뿐이라 앱 크기는 그대로다.
  path_provider: ^2.1.6

  # 푸시 알림 수신 (FCM 디바이스 토큰 등록). 설정 파일(google-services.json /
  # firebase_options.dart)이 없으면 초기화가 조용히 실패하고 no-op — 카카오 SDK 와 같은 방식.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # 앱 오류 기록(LAUNCH_REVIEW U17). firebase_core 3.x 와 짝인 마지막 4.x — 5.x 는 core 4.x 를 요구한다.
  firebase_crashlytics: ^4.3.10

  # 합주실 지도 (카카오맵). 네이티브 SDK 래퍼 — Android/iOS 전용, 웹은 목록만 표시(kIsWeb 가드).
  # 장소 검색·지오코딩도 카카오라 검색 결과 핀과 저장 좌표가 정확히 일치한다.
  # 별도 키 없이 로그인과 같은 네이티브 앱 키(KAKAO_NATIVE_APP_KEY)를 쓴다.
  kakao_map_sdk: ^1.3.0

  # 토큰 보관 (KeyStore / Keychain)
  flutter_secure_storage: ^9.2.2

  # 폰트 (Noto Sans KR / Bebas Neue / JetBrains Mono)
  google_fonts: ^6.2.1

  # 날짜 포매팅 (flutter_localizations 가 0.20.x 를 요구)
  intl: ^0.20.2

  # 초대 링크(bandule://invite/{code})를 앱이 받아 합류 화면으로 넘긴다.
  # 이게 없으면 링크를 눌러도 앱이 열리지 않는다 - 예전에는 스킴이 네이버 밴드 것과
  # 겹쳐서 그 앱이 열렸다.
  app_links: ^7.2.1

  # 인앱결제(밴드 PREMIUM 연 구독). Android 는 Play Billing 을 감싼다. 결제는 스토어에서
  # 일어나고, 성공 시 구매 토큰을 서버(/plan/google/verify)로 보내 검증받는다.
  in_app_purchase: ^3.2.0

  # 요금제 화면의 "Google Play 에서 구독 관리" 버튼 — Play 구독 화면(https 링크)을 외부 앱으로 연다.
  # Flutter 팀 공식 패키지. 2026-09-27 추가 승인(LAUNCH_REVIEW P4).
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
