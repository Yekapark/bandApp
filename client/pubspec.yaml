name: bandapp_client
description: 밴드 합주 관리 앱 Flutter 클라이언트
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 한국어 로케일 (날짜/시간 피커 등 Material 위젯 번역)
  flutter_localizations:
    sdk: flutter

  # 상태관리
  flutter_riverpod: ^2.5.1

  # 라우팅
  go_router: ^14.2.7

  # 네트워크
  dio: ^5.7.0

  # 카카오 로그인 (user 모듈만 — 로그인 + 사용자 조회). 네이티브 앱 키 필요.
  kakao_flutter_sdk_user: ^1.9.6

  # 게시판 첨부: 사진/영상 선택 → R2 presigned URL 로 직접 업로드.
  image_picker: ^1.1.2

  # 합주실 지도 (네이버 지도). Android/iOS 전용 — 웹은 목록만 표시(kIsWeb 가드).
  # NCP 지도 클라이언트 ID 필요: --dart-define=NAVER_MAP_CLIENT_ID=xxxx
  flutter_naver_map: ^1.4.4

  # 토큰 보관 (KeyStore / Keychain)
  flutter_secure_storage: ^9.2.2

  # 폰트 (Noto Sans KR / Bebas Neue / JetBrains Mono)
  google_fonts: ^6.2.1

  # 날짜 포매팅 (flutter_localizations 가 0.20.x 를 요구)
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
