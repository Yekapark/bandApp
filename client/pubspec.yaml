name: bandapp_client
description: 밴드 합주 관리 앱 Flutter 클라이언트
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 한국어 로케일 (날짜/시간 피커 등 Material 위젯 번역)
  flutter_localizations:
    sdk: flutter

  # 상태관리
  flutter_riverpod: ^2.5.1

  # 라우팅
  go_router: ^14.2.7

  # 네트워크
  dio: ^5.7.0

  # 카카오 로그인 (user 모듈만 — 로그인 + 사용자 조회). 네이티브 앱 키 필요.
  kakao_flutter_sdk_user: ^1.9.6

  # 게시판 첨부: 사진/영상 선택 → R2 presigned URL 로 직접 업로드.
  image_picker: ^1.1.2

  # 게시판 영상 첨부 재생. 컨트롤은 이 패키지의 VideoProgressIndicator 로 충분해서
  # chewie 같은 UI 패키지는 더 붙이지 않는다.
  video_player: ^2.9.2

  # 푸시 알림 수신 (FCM 디바이스 토큰 등록). 설정 파일(google-services.json /
  # firebase_options.dart)이 없으면 초기화가 조용히 실패하고 no-op — 카카오 SDK 와 같은 방식.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # 합주실 지도 (카카오맵). 네이티브 SDK 래퍼 — Android/iOS 전용, 웹은 목록만 표시(kIsWeb 가드).
  # 장소 검색·지오코딩도 카카오라 검색 결과 핀과 저장 좌표가 정확히 일치한다.
  # 별도 키 없이 로그인과 같은 네이티브 앱 키(KAKAO_NATIVE_APP_KEY)를 쓴다.
  kakao_map_sdk: ^1.3.0

  # 토큰 보관 (KeyStore / Keychain)
  flutter_secure_storage: ^9.2.2

  # 폰트 (Noto Sans KR / Bebas Neue / JetBrains Mono)
  google_fonts: ^6.2.1

  # 날짜 포매팅 (flutter_localizations 가 0.20.x 를 요구)
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
