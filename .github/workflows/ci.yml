name: CI

on:
  push:
    branches: [ main ]
  # base 제한을 두지 않는다 — 스택 PR(브랜치 → 브랜치)에서도 돌아야 한다.
  # main 만 걸어 뒀을 때, 브랜치를 향한 PR 은 백엔드가 통째로 CI 없이 지나갔다.
  # client-ci.yml 과 같은 조건이다.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build & test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      # 테스트가 깨졌을 때 로그만으로는 "1 failed" 밖에 안 보여서 어느 테스트인지 찾느라
      # 원시 로그를 뒤져야 했다. 리포트를 올려 두면 클릭 한 번으로 실패한 테스트와
      # 스택트레이스가 나온다.
      # 리포트·원시 로그를 열 수 없는 곳(Claude 세션은 Actions 로그·아티팩트 저장소에 접속이 막혀 있다)에서도
      # 무엇이 깨졌는지 PR 체크의 주석(annotation)으로 바로 보이게 한다. 컴파일 오류와 실패한 테스트 이름·메시지.
      - name: 실패 요약을 주석으로
        if: failure()
        run: |
          ./gradlew compileJava compileTestJava --no-daemon -q 2>&1 | grep -E '\.java:[0-9]+: error:' | head -10 | sed 's/^/::error::/' || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('build/test-results/test/*.xml'):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for bad in tc.findall('failure') + tc.findall('error'):
                      msg = (bad.get('message') or bad.text or '').strip().replace('\n', ' ')[:800]
                      print(f"::error title={tc.get('classname')}.{tc.get('name')}::{msg}")
          PY

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

  # Gradle 없이 몇 초면 끝난다. 빌드가 오래 걸려도 규칙 위반은 먼저 답을 준다.
  # 검사 내용과 뺀 이유는 tools/check-repo-rules.sh 주석에 있다.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 저장소 규칙 검사 (엔티티 Lombok · 비밀 파일)
        run: |
          # 검사 도구가 없어 실행하지 못한 경우를 통과로 보고하지 않아야 한다.
          if PATH=/nonexistent /bin/sh tools/check-repo-rules.sh; then
            echo "::error::검사 도구가 없는데 통과했다"
            exit 1
          fi
          sh tools/check-repo-rules.sh
