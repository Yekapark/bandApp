# 운영 서버를 매일 한 번 본다. 배포 직후 헬스체크 말고는 감시가 없어서, 밴드에 안 붙은
# 구매 알림이 7일 동안 초당 한 번씩 서버를 때리는 동안 아무도 몰랐다
# (docs/TROUBLESHOOTING.md 2026-09-09).
#
# 시크릿은 Deploy 워크플로가 쓰는 것을 그대로 쓴다: DEPLOY_HOST·DEPLOY_USER·DEPLOY_KEY(·DEPLOY_PORT).
# 검사 내용과 임계값은 deploy/prod-check.sh 에 있다.
#
# 이 저장소는 공개고 **Actions 로그도 공개**다. 그래서 서버 스크립트를 QUIET=1 로 돌려
# 숫자만 받는다 — 에러 줄·요청 경로에는 이메일이나 구매 토큰이 섞일 수 있다.

name: 운영 점검

on:
  schedule:
    - cron: '0 22 * * *'      # 매일 07:00 KST (UTC 22:00)
  workflow_dispatch:
    inputs:
      rehearsal:
        description: '리허설 — 서버를 보지 않고 모든 검사가 실패한 것처럼 이슈(=메일)를 만든다'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: write   # 아래 「예약 실행 유지」 — 이 워크플로를 스스로 다시 켠다
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DOMAIN: api.bandule.com
    steps:
      - uses: actions/checkout@v7

      # 밖에서 본 모습. ssh 가 안 되더라도 이건 답을 준다.
      # 앱이 컨테이너 안에서 healthy 여도 Nginx·인증서가 죽으면 사용자는 못 쓴다.
      - name: 밖에서 (HTTPS · 인증서)
        if: env.DEPLOY_HOST != '' && !inputs.rehearsal
        run: |
          set -o pipefail
          exec > >(tee outside.txt) 2>&1   # 이슈 본문에 요약 줄을 옮기려고 남긴다
          fail=0
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$DOMAIN/actuator/health" || echo 000)
          if [ "$code" = 200 ]; then echo "https    $code"; else echo "!! https    $code — 밖에서 앱 접속이 안 된다(사용자 앱이 지금 안 됨)"; echo "   → 서버 안 상태: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'cd /opt/bandapp && bandule health'"; fail=1; fi

          end=$(echo | openssl s_client -servername "$DOMAIN" -connect "$DOMAIN:443" 2>/dev/null \
                | openssl x509 -noout -enddate | cut -d= -f2)
          if [ -n "$end" ]; then
            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            # Let's Encrypt 는 만료 30일 전부터 갱신한다. 14일 아래면 갱신이 멈춘 것이다.
            if [ "$days" -lt 14 ]; then echo "!! 인증서  ${days}일 남음 — 자동 갱신이 멈췄다"; echo "   → 갱신 기록: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'cd /opt/bandapp && docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail 50 certbot'"; fail=1; else echo "인증서   ${days}일 남음"; fi
          else
            echo "!! 인증서  확인 실패 — 443 에 접속이 안 된다"; fail=1
          fi
          exit $fail
        continue-on-error: true
        id: outside

      - name: 서버에서 (컨테이너 · 디스크 · 백업 · 에러 · 요청)
        if: env.DEPLOY_HOST != '' && !inputs.rehearsal
        id: inside
        continue-on-error: true
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -o pipefail
          umask 077
          exec > >(tee inside.txt) 2>&1   # 이슈 본문에 요약 줄을 옮기려고 남긴다
          printf '%s\n' "$DEPLOY_KEY" > deploy_key
          # 스크립트를 흘려 넣는다 — 서버 클론이 낡아 있어도 **이 커밋의 검사**가 돈다.
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
              'QUIET=1 sh -s' < deploy/prod-check.sh

      # 어떤 메일 업체로 보내고 있는지 — 문서끼리 엇갈린 적이 있어서 서버 값을 주석으로 남긴다(2026-09-28: smtp.resend.com).
      # 호스트 이름만 뽑는다(비밀번호·계정은 출력하지 않는다). 개인정보처리방침의 위탁 업체와 맞는지 볼 때 쓴다.
      - name: 메일 발신 설정
        if: env.DEPLOY_HOST != ''
        continue-on-error: true
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > deploy_key
          host=$(ssh -i deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "grep -m1 -E '^MAIL_SMTP_HOST=' /opt/bandapp/.env.prod | cut -d= -f2- | tr -d '\"' | tr -cd 'A-Za-z0-9.-'")
          echo "::notice title=메일 발신 호스트::${host:-비어 있음(기본값 사용)}"

      - name: 배포 대상 없음 — 건너뜀
        if: env.DEPLOY_HOST == ''
        run: echo "::notice title=점검 건너뜀::DEPLOY_HOST 시크릿이 비어 있다."

      # 실패 메일이 실제로 어떻게 오는지 보는 리허설(수동 실행에서 rehearsal 체크). 서버는 건드리지 않는다.
      # 아래 줄은 deploy/prod-check.sh 의 bad "…" 문구와 위 "밖에서" 단계의 !! 문구를 숫자만 바꿔 옮긴 것 —
      # 검사를 추가·수정하면 여기도 맞춘다.
      - name: 리허설 — 모든 검사 실패 흉내
        if: inputs.rehearsal
        id: rehearsal
        continue-on-error: true
        run: |
          cat > outside.txt <<'EOF'
          !! https    000 — 밖에서 앱 접속이 안 된다(사용자 앱이 지금 안 됨)
             → 서버 안 상태: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'cd /opt/bandapp && bandule health'
          !! 인증서  9일 남음 — 자동 갱신이 멈췄다
             → 갱신 기록: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'cd /opt/bandapp && docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail 50 certbot'
          EOF
          cat > inside.txt <<'EOF'
          !! health   앱 컨테이너 상태가 healthy 가 아니다: unhealthy
             → 원인 보기: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'bandule errors'
             → 앱 다시 띄우기(30~60초 끊김): ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'cd /opt/bandapp && bandule restart'
          !! 컨테이너  4/5 만 떠 있다
             → 어느 게 꺼졌나: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'cd /opt/bandapp && docker compose -f docker-compose.prod.yml --env-file .env.prod ps -a'
             → 다 다시 띄우기: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'cd /opt/bandapp && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d'
          !! 디스크   91% (기준 85%) — 차면 DB·백업이 멈춘다
             → 무엇이 차지하나: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'cd /opt/bandapp && bandule disk'
             → 안 쓰는 도커 이미지 정리(데이터는 안 지움): ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'docker system prune -f'
          !! 백업     마지막이 40시간 전 (backups/bandapp-예시.dump) — 매일 백업이 멈췄다
             → 왜 멈췄나: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'tail -30 /var/log/bandapp-backup.log; crontab -l | grep -i backup'
             → 지금 한 번 백업: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'cd /opt/bandapp && bandule backup'
          !! 에러     24시간 350줄 (기준 200) — 무언가 반복해서 실패 중
             → 어떤 에러가 많은지: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'sh -s' < deploy/prod-check.sh
          !! 요청     1시간 4000건 (기준 2000) — 공격이나 재전송 폭주일 수 있다
             → 어느 경로가 맞고 있나: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'sh -s' < deploy/prod-check.sh
          !! 인증서   15일 남음 (기준 21일) — 자동 갱신이 멈췄다. 만료일에 앱 접속이 끊긴다
             → 갱신 기록: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'cd /opt/bandapp && docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail 50 certbot'
          !! 구독해지 24시간 1건 실패 — 탈퇴한 결제자의 구독이 아직 청구될 수 있다(서버가 매시 다시 시도)
             → 어느 밴드인지: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'sh -s' < deploy/prod-check.sh   (구독해지 아래 bandId)
             → 계속 걸리면 그 밴드 구독을 Play Console › 주문 관리에서 직접 해지 — 다음 재시도가 확인하고 멈춘다
          !! 빈밴드삭제 24시간 1건 실패 — 탈퇴한 사람의 글·사진이 아직 남아 있다(서버가 10분마다 다시 시도)
             → 왜 실패하나: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'sh -s' < deploy/prod-check.sh   (cause 가 R2 면 기다리고, 구독 해지 실패면 Play Console 에서 직접 해지)
          !! 메모리   남은 몫 6% (사용 1840/1962MB, 기준 10% 이상) — 더 차면 앱이나 DB 가 강제 종료된다
             → 누가 쓰나: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'docker stats --no-stream --format "{{.Name}} {{.MemUsage}}"'
             → 앱만 다시 띄워 비우기(30~60초 끊김): ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'cd /opt/bandapp && bandule restart'
          !! Redis    300MB · 키 90000개 (기준 256MB) — 유효기간 없는 키가 쌓이는 중일 수 있다
             → 어떤 키가 많나: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'docker exec bandapp-redis-1 sh -c "REDISCLI_AUTH=\$REDIS_PASSWORD redis-cli --scan | cut -d: -f1-2 | sort | uniq -c | sort -rn | head"'
             → 모르겠으면 이 메일을 Claude 에게 — 유효기간 없는 키를 넣는 코드를 찾아 고친다
          !! 재시작   bandapp-app-1(재시작 2, OOM true) — 죽었다가 다시 뜬 컨테이너가 있다
             → 왜 죽었나: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'docker logs --tail 50 bandapp-app-1; dmesg | grep -i "killed process" | tail -5'
          !! R2백업   마지막이 50시간 전 (bandapp-예시.dump.gpg) — 서버 밖으로 백업이 안 나가고 있다
             → 백업 기록(업로드 실패 줄): ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'tail -30 /var/log/bandapp-backup.log'
             → 지금 한 번 백업(R2 업로드 포함): ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'cd /opt/bandapp && bandule backup'
          !! 재부팅   보안 업데이트(3개)가 9일째 재부팅을 기다린다 — 재부팅해야 적용된다
             → 사용자가 적은 시간(새벽)에: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'reboot'   — 1~2분 뒤 앱·DB·Redis 가 저절로 다시 뜬다
             → 다시 떴는지: ssh -i ~/.ssh/bandule_deploy root@64.176.231.126 'cd /opt/bandapp && bandule health'
          !! 밴드없는결제 미해결 1건 (번호 1, 가장 오래된 것 0일 전) — 돈은 들어왔는데 PREMIUM 을 줄 밴드를 못 찾았다
             → 내 PC 저장소 폴더에서 보기: python tools/purchases.py list
             → 결제한 밴드를 알면 그 밴드에 반영(10분 안): python tools/purchases.py link <번호> <밴드ID>
             → 모르면 그대로 둔다: 결제 3일 뒤 Google 이 자동 환불하고 이 경보는 저절로 꺼진다
             → 잘 모르겠으면 이 메일 내용을 그대로 Claude 에게 붙여넣는다
          EOF
          cat outside.txt inside.txt
          exit 1

      # 운영자에게 **매일** 메일을 직접 보낸다 — 걸리면 「❌ 실패」(걸린 줄 + 처리 명령), 아니면 「✅ 정상」(숫자 요약).
      # 정상 메일도 보내는 이유: 메일이 안 오면 "정상" 인지 "점검이 아예 안 돌았는지" 모른다. 예약 실행이 꺼지거나
      # (공개 저장소는 60일 활동이 없으면 GitHub 가 끈다) 메일 키가 바뀌면 조용히 멈춘다 → 아침에 메일이 없으면 고장이다.
      # GitHub 이슈 알림은 Watch·알림 주소 설정이 어긋나면 안 와서(2026-10-13 리허설) 쓰지 않는다. Resend HTTP API 로
      # Actions 에서 바로 보내 서버가 죽어도 나간다. 시크릿: RESEND_API_KEY(서버 .env.prod 의 MAIL_SMTP_PASSWORD 와 같은 키),
      # ALERT_EMAIL_TO(받을 주소, 쉼표로 여러 개). 비면 경고만 남긴다. 보내기에 실패하면 이 단계가 실패로 남는다.
      - name: 메일 보내기 (매일)
        if: env.DEPLOY_HOST != '' || steps.rehearsal.outcome == 'failure'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ steps.outside.outcome == 'failure' || steps.inside.outcome == 'failure' || steps.rehearsal.outcome == 'failure' }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_EMAIL_TO" ]; then
            echo "::warning title=메일 안 보냄::RESEND_API_KEY·ALERT_EMAIL_TO 시크릿이 비어 있다 (docs/OPERATIONS.md §8)"
            exit 0
          fi
          prefix=""; [ "${{ inputs.rehearsal }}" = true ] && prefix="[리허설] "
          when="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          if [ "$FAILED" = true ]; then
            subject="${prefix}❌ [밴듈] 운영 점검 실패 $(TZ=Asia/Seoul date +%F)"
            summary=$(cat outside.txt inside.txt 2>/dev/null | grep -E '^(!!|  *→)' || echo "(요약을 못 읽었다 — 실행 로그를 본다)")
            text="밴듈 운영 점검이 걸렸다 ($when).

          $summary

          실행 로그: $RUN
          !! 는 걸린 검사, → 는 그 자리에서 칠 명령이다. 처리 방법은 docs/OPERATIONS.md §8."
          else
            subject="✅ [밴듈] 운영 점검 정상 $(TZ=Asia/Seoul date +%F)"
            summary=$(cat outside.txt inside.txt 2>/dev/null | grep -vE '^(==|\(|$)' || echo "(요약을 못 읽었다)")
            text="밴듈 운영 점검 정상 ($when). 할 일 없음.

          $summary

          이 메일이 아침에 안 오면 점검이 멈춘 것이다 — GitHub › Actions › 운영 점검 을 본다.
          실행 로그: $RUN"
          fi
          jq -n --arg to "$ALERT_EMAIL_TO" --arg subject "$subject" --arg text "$text"             '{from: "밴듈 운영 점검 <notice@bandule.com>", to: ($to | split(",") | map(gsub("^ +| +$"; ""))), subject: $subject, text: $text}' > mail.json
          code=$(curl -s -o resend.out -w '%{http_code}' -X POST https://api.resend.com/emails                  -H "Authorization: Bearer $RESEND_API_KEY" -H 'Content-Type: application/json' --data @mail.json)
          if [ "$code" = 200 ]; then echo "메일 보냄 ($subject)"; else echo "!! 메일 실패 HTTP $code"; cat resend.out; exit 1; fi

      # 공개 저장소의 예약 실행은 60일 동안 저장소 활동이 없으면 GitHub 가 끈다 — 출시 뒤 코드를 안 고치면 매일 점검이
      # 조용히 멈춘다. 돌 때마다 이 워크플로를 다시 켜(enable) 타이머를 새로 시작한다. 커밋을 만들지 않는다.
      # 그래도 멈추면 위 「매일 메일」 이 안 오는 것으로 안다.
      - name: 예약 실행 유지 (60일 자동 정지 방지)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/prod-check.yml/enable" && echo "예약 실행 유지함"

      # 둘 중 하나라도 걸리면 이슈로 남긴다. 이미 열린 것이 있으면 댓글만 단다 —
      # 매일 새 이슈가 쌓이면 아무도 안 본다.
      - name: 이상하면 이슈
        if: (env.DEPLOY_HOST != '' && (steps.outside.outcome == 'failure' || steps.inside.outcome == 'failure')) || steps.rehearsal.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 걸린 검사 요약(`!!` 줄)과 처리 명령(`→` 줄)만 옮긴다 — QUIET=1 출력이라 숫자뿐이고 이미 공개 로그에 있다.
          # 메일 본문에 그대로 실려서, 메일만 보고 무엇이 걸렸고 무엇을 치면 되는지 알 수 있게 한다.
          summary=$(cat outside.txt inside.txt 2>/dev/null | grep -E '^(!!|  *→)' || echo "(요약을 못 읽었다 — 아래 실행 로그를 본다)")
          body="운영 점검이 걸렸다.

          \`\`\`
          $summary
          \`\`\`

          실행 로그: $RUN

          로그에는 숫자만 남긴다(공개 저장소). 자세한 것은 서버에서:
          \`ssh -i ~/.ssh/bandule_deploy root@\$DEPLOY_HOST 'sh -s' < deploy/prod-check.sh\`"
          gh label create prod-check --color B60205 --description "매일 운영 점검" 2>/dev/null || true
          num=$(gh issue list --label prod-check --state open --limit 20 --json number,title               --jq '[.[] | select(.title | startswith("[리허설]") | not)][0].number // empty')   # 리허설 이슈에 진짜 경보를 섞지 않는다
          if [ "${{ inputs.rehearsal }}" = true ]; then
            # 리허설은 열린 실제 경보에 섞지 않고 늘 새 이슈로 — 메일 제목에 [리허설] 이 붙는다. 확인 뒤 손으로 닫는다.
            gh issue create --title "[리허설] 운영 점검 실패 $(date -u +%F)" --label prod-check --body "$body"
          elif [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "운영 점검 실패 $(date -u +%F)" --label prod-check --body "$body"
          fi
          exit 1
