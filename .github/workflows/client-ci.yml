name: Client CI

on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: analyze (errors only)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: test
        run: mkdir -p build && flutter test --file-reporter json:build/test-report.json

      # 원시 로그를 못 여는 곳에서도 어느 테스트가 왜 깨졌는지 PR 체크 주석으로 보이게 한다(ci.yml 과 같은 이유).
      - name: 실패 요약을 주석으로
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os
          path = 'build/test-report.json'
          if not os.path.exists(path):
              raise SystemExit(0)
          names, errors = {}, {}
          for line in open(path, encoding='utf-8'):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              if e.get('type') == 'testStart':
                  names[e['test']['id']] = e['test']['name']
              elif e.get('type') == 'error':
                  errors.setdefault(e['testID'], []).append(e.get('error', ''))
          for tid, errs in list(errors.items())[:10]:
              msg = ' | '.join(errs).replace('\n', ' ')[:800]
              print(f"::error title={names.get(tid, tid)}::{msg}")
          PY
