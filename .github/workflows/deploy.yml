# main 의 CI 가 통과하면 이미지를 만들어 GHCR 에 올리고 VM 에 배포한다.
#
# 필요한 리포지토리 시크릿:
#   DEPLOY_HOST  배포 대상 VM 주소
#   DEPLOY_USER  SSH 사용자 (docker 그룹에 속해 있어야 한다)
#   DEPLOY_KEY   그 사용자의 SSH 개인키 (OpenSSH 형식)
#   DEPLOY_PORT  (선택) SSH 포트, 기본 22
# VM 에는 /opt/bandapp 에 이 리포가 클론돼 있고 .env.prod 가 채워져 있어야 한다 (docs/DEPLOY.md).

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:          # 롤백·수동 재배포용

concurrency:
  group: deploy
  cancel-in-progress: false   # 배포는 중간에 끊지 않는다

jobs:
  deploy:
    # 수동 실행이 아니면 CI 가 성공했을 때만 돈다.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run 은 기본적으로 기본 브랜치 HEAD 를 본다. CI 가 통과한 그 커밋을 쓴다.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: vars
        run: |
          echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # GHCR 경로는 소문자만 받는다 (리포 이름이 bandApp 이라 그대로 쓰면 거부된다).
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -eu
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /opt/bandapp
            git fetch --quiet origin main && git checkout --quiet -f origin/main
            sh deploy/deploy.sh "$IMAGE_TAG"
        env:
          # 워크플로 실행 동안만 유효한 토큰이라 VM 에 PAT 를 심어 둘 필요가 없다.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha }}
