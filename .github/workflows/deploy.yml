# main 의 CI 가 통과하면 이미지를 만들어 GHCR 에 올리고 VM 에 배포한다.
#
# 필요한 리포지토리 시크릿:
#   DEPLOY_HOST  배포 대상 VM 주소
#   DEPLOY_USER  SSH 사용자 (docker 그룹에 속해 있어야 한다)
#   DEPLOY_KEY   그 사용자의 SSH 개인키 (OpenSSH 형식)
#   DEPLOY_PORT  (선택) SSH 포트, 기본 22
# VM 에는 /opt/bandapp 에 이 리포가 클론돼 있고 .env.prod 가 채워져 있어야 한다 (docs/DEPLOY.md).

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:          # 롤백·수동 재배포용

concurrency:
  group: deploy
  cancel-in-progress: false   # 배포는 중간에 끊지 않는다

jobs:
  deploy:
    # 수동 실행이 아니면 CI 가 성공했을 때만 돈다.
    #
    # workflow_run 의 branches: [main] 은 "CI 를 돌린 브랜치 이름" 만 본다. 남의 포크에서 이름이 main 인
    # 브랜치로 PR 을 열면 그 PR 의 CI 도 head_branch=main 으로 이 조건을 통과해, **포크의 코드로 이미지를
    # 만들어 운영에 배포**하게 된다(시크릿·SSH 키를 쥔 채로). 그래서 이 저장소에 push 된 CI 만 받는다.
    # 수동 실행도 main 에서만 — 다른 브랜치에서 누르면 머지 안 된 코드가 운영에 나간다.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # 배포 대상 서버가 아직 없을 수 있다. secrets 컨텍스트는 job 단위 if 에서 못 쓰므로
    # env 로 올려서 스텝 조건에 쓴다.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run 은 기본적으로 기본 브랜치 HEAD 를 본다. CI 가 통과한 그 커밋을 쓴다.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # 머지가 연달아 들어오면 CI 가 순서 없이 끝난다. 뒤 커밋이 먼저 배포된 다음 앞 커밋의 CI 가 끝나면
      # 옛 코드가 덮어써져 방금 고친 것이 운영에서 사라진다(latest 태그도 옛 이미지로 바뀐다).
      # 지금 main 의 끝이 아니면 이번 실행은 건너뛴다 — 끝 커밋의 실행이 배포한다.
      - id: fresh
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -n "$tip" ] && [ "$tip" != "$SHA" ]; then
            echo "::notice title=배포 건너뜀::$SHA 는 main 의 끝($tip)이 아니다. 더 새 커밋의 실행이 배포한다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - id: vars
        if: steps.fresh.outputs.ok == 'true'
        run: |
          echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # GHCR 경로는 소문자만 받는다 (리포 이름이 bandApp 이라 그대로 쓰면 거부된다).
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.fresh.outputs.ok == 'true'

      - uses: docker/login-action@v4
        if: steps.fresh.outputs.ok == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        if: steps.fresh.outputs.ok == 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 서버가 생기기 전까지는 여기서 멈춘다. 이미지는 이미 GHCR 에 올라갔으므로
      # 서버를 잡은 뒤 시크릿만 채우면 그때부터 자동으로 배포된다.
      - name: 배포 대상 없음 — SSH 단계 건너뜀
        if: steps.fresh.outputs.ok == 'true' && env.DEPLOY_HOST == ''
        run: |
          echo "::notice title=배포 건너뜀::DEPLOY_HOST 시크릿이 비어 있다. 이미지 ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }} 는 GHCR 에 올라갔다. 서버를 잡고 DEPLOY_HOST/DEPLOY_USER/DEPLOY_KEY 를 넣으면 이 단계부터 자동으로 이어진다 (docs/LAUNCH_CHECKLIST.md 6단계)."

      - name: SSH 배포
        if: steps.fresh.outputs.ok == 'true' && env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,GIT_SHA,FORCE
          script: |
            set -eu
            cd /opt/bandapp
            git fetch --quiet origin main
            # 서버가 바뀌지 않은 머지(앱·문서·테스트·워크플로)로는 재시작하지 않는다. 재시작마다 잠깐 502 가 나서
            # 실기기 QA 중에 문서·앱 머지 6건이 502 를 반복시켰다(2026-10-04).
            # 기준은 "직전 커밋" 이 아니라 **지금 서버에 배포돼 있는 커밋**(이 클론의 HEAD — 배포 때마다 그 커밋으로
            # checkout 한다). 위 fresh 단계가 중간 커밋을 건너뛰므로, 직전 커밋과만 비교하면 앞 커밋의 서버 변경이
            # 뒤 문서 커밋에 묻혀 영영 배포되지 않는다. 건너뛸 때는 HEAD 를 그대로 둬서 다음 비교에 쌓이게 한다.
            # 비교가 실패하면(커밋을 못 찾는 등) 배포한다. 수동 실행(롤백·재배포)은 항상 배포한다.
            deployed=$(git rev-parse HEAD)
            if [ "$FORCE" != "true" ] && git diff --quiet "$deployed" "$GIT_SHA" --                 src/main build.gradle.kts settings.gradle.kts gradle Dockerfile docker-compose.prod.yml deploy; then
              echo "== 서버 코드 변경 없음 ($deployed → $GIT_SHA) — 재시작하지 않는다"
              exit 0
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # 이미지와 같은 커밋의 compose·nginx·스크립트를 쓴다(origin/main 이면 그사이 들어온 커밋이 섞인다).
            git checkout --quiet -f "$GIT_SHA"
            sh deploy/deploy.sh "$IMAGE_TAG"
        env:
          # 워크플로 실행 동안만 유효한 토큰이라 VM 에 PAT 를 심어 둘 필요가 없다.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
