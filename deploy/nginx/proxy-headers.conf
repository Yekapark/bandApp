proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Proto $scheme;

# XFF 를 "이어붙이지" 않고 덮어쓴다($proxy_add_x_forwarded_for 가 아니다).
# 클라이언트가 보낸 X-Forwarded-For 를 그대로 물려주면 톰캣 RemoteIpValve 가 그 위조값을
# 클라이언트 IP 로 삼아, IP 기준 레이트리밋(로그인 브루트포스·초대코드 대입)이 통째로 뚫린다.
#
# 여기서 $remote_addr 은 real_ip 모듈이 이미 정리한 값이다(cloudflare-realip.conf):
# Cloudflare 대역에서 왔으면 CF-Connecting-IP 의 진짜 사용자 IP, 아니면 소켓 주소.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;

proxy_http_version 1.1;
proxy_connect_timeout 5s;
proxy_read_timeout    60s;
