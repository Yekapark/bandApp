spring:
  application:
    name: bandapp
  autoconfigure:
    # 이메일 로그인은 passwordEncoder.matches()로 직접 처리한다. 이 자동설정이 켜져 있으면
    # 스프링이 부팅 때마다 임의 비밀번호를 로그에 찍는다.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bandapp}
    username: ${DB_USERNAME:bandapp}
    password: ${DB_PASSWORD:bandapp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # 운영에서는 prod 프로파일이 이 둘을 false 로 덮어 API 명세 노출을 막는다(application-prod.yml).
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:}                       # 기본값 없음 — 미설정 시 기동 실패(의도)
    issuer: bandapp
    access-token-ttl: ${JWT_ACCESS_TTL:PT30M}    # 30분
    refresh-token-ttl: ${JWT_REFRESH_TTL:P14D}   # 14일 (슬라이딩)
  kakao:
    api-base-url: https://kapi.kakao.com
    app-id: ${KAKAO_APP_ID:}
    admin-key: ${KAKAO_ADMIN_KEY:}
    connect-timeout: PT2S
    read-timeout: PT3S
  naver:
    api-base-url: https://maps.apigw.ntruss.com                 # NCP 콘솔이 안내하는 주소로 코드 수정 없이 교체 가능
    client-id: ${NAVER_MAP_CLIENT_ID:}                          # 비우면 지오코딩만 건너뛰고 좌표 없이 등록된다
    client-secret: ${NAVER_MAP_CLIENT_SECRET:}
    connect-timeout: PT2S
    read-timeout: PT3S
    search:                                                     # 지역검색(장소 검색) — 네이버 개발자센터 앱, 지도 API와 다른 자격증명
      api-base-url: https://openapi.naver.com
      client-id: ${NAVER_SEARCH_CLIENT_ID:}                     # 비우면 합주실 주소 검색이 항상 빈 목록을 반환한다
      client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}
      connect-timeout: PT2S
      read-timeout: PT3S
  r2:
    account-id: ${R2_ACCOUNT_ID:}                               # 비우면 미디어 업로드 API 만 503, 게시판·신고·차단은 정상
    bucket: ${R2_BUCKET:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    endpoint: ${R2_ENDPOINT:}                                   # 비우면 https://{accountId}.r2.cloudflarestorage.com
    upload-url-ttl: ${R2_UPLOAD_URL_TTL:PT15M}                  # 5~15분으로 clamp (BUILD_PLAN 제한값)
    download-url-ttl: ${R2_DOWNLOAD_URL_TTL:PT10M}
    connect-timeout: PT2S
    read-timeout: PT5S
  fcm:
    project-id: ${FCM_PROJECT_ID:}                              # 비우면 푸시 발송만 no-op, 설정·토큰 API 는 정상
    credentials-path: ${FCM_CREDENTIALS_PATH:}                  # 서비스 계정 JSON 파일 경로 — 둘 다 있으면 이쪽 우선
    credentials-json: ${FCM_CREDENTIALS_JSON:}                  # 파일 대신 JSON 문자열로도 주입 가능(경로가 없을 때만)
    connect-timeout: PT2S
    read-timeout: PT5S
  withdrawal:
    retention-days: ${WITHDRAWAL_RETENTION_DAYS:90}
    purge-cron: ${WITHDRAWAL_PURGE_CRON:0 30 4 * * *}
    purge-zone: Asia/Seoul
  recurring:
    zone: Asia/Seoul                                     # 정기 규칙의 요일·시각을 해석하는 기준 시간대
    horizon-weeks: ${RECURRING_HORIZON_WEEKS:8}          # 미리 만들어 둘 기간 (BUILD_PLAN "향후 8주분")
    extend-cron: ${RECURRING_EXTEND_CRON:0 0 5 * * *}    # 매일 05:00 KST 회차 이어 만들기 배치
  notification:
    zone: Asia/Seoul                                     # 배치 cron 해석 기준 시간대
    default-reminder-offsets: 60                         # 설정 행이 없는 사용자의 기본 리마인더 시점(분, 쉼표 구분)
    max-reminder-offset-minutes: ${NOTI_MAX_OFFSET:1440} # 리마인더 시점 상한(분). 1440 = 24시간 전
    max-reminder-offsets: 5                              # 사용자당 지정 가능한 리마인더 시점 개수
    nudge-lead-hours: ${NOTI_NUDGE_LEAD_HOURS:24}        # N시간 뒤 시작하는 일정의 미응답자에게 독촉
    dispatch-retention-days: ${NOTI_DISPATCH_RETENTION:30}   # 발송 이력 보관 기간
    reminder-cron: ${NOTI_REMINDER_CRON:0 */5 * * * *}   # 5분마다 리마인더 발송 검사
    nudge-cron: ${NOTI_NUDGE_CRON:0 0 19 * * *}          # 매일 19:00 KST 참석 미응답 독촉
  media:
    zone: Asia/Seoul
    orphan-age: ${MEDIA_ORPHAN_AGE:PT1H}                 # 이 시간 이상 PENDING 인 첨부를 고아로 보고 정리
    expire-cron: ${MEDIA_EXPIRE_CRON:0 15 4 * * *}       # 매일 04:15 KST 보관기한 만료 미디어 → R2 삭제 + EXPIRED
    orphan-cron: ${MEDIA_ORPHAN_CRON:0 10 * * * *}       # 매시 10분 콜백 없는 고아 PENDING 정리
  plan:
    premium-period-days: ${PLAN_PREMIUM_PERIOD_DAYS:30}  # no-op 게이트웨이가 PREMIUM 구독기간 종료를 계산하는 기준 일수
    downgrade-grace-days: ${PLAN_DOWNGRADE_GRACE_DAYS:30} # PREMIUM 해지 시 기존 미디어에 부여하는 유예기간(일)
    plan-code: PREMIUM_MONTHLY                           # 결제 게이트웨이에 넘기는 요금제 코드
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  deeplink:
    base-url: ${DEEPLINK_BASE_URL:http://localhost:8080}    # 초대 링크·랜딩 페이지 공개 주소
    scheme: ${DEEPLINK_SCHEME:bandapp}                       # 앱 커스텀 스킴 (bandapp://invite/CODE)
    ios-app-id: ${IOS_APP_ID:}                               # 예: TEAMID.com.yeka.bandapp (AASA 검증용)
    ios-app-store-url: ${IOS_APP_STORE_URL:https://apps.apple.com/app/id0000000000}
    android-package: ${ANDROID_PACKAGE:com.yeka.bandapp}
    android-play-store-url: ${ANDROID_PLAY_STORE_URL:https://play.google.com/store/apps/details?id=com.yeka.bandapp}
    android-sha256-cert-fingerprints: ${ANDROID_SHA256_CERT_FINGERPRINTS:}   # 쉼표 구분, assetlinks.json 검증용
  ratelimit:
    invite-join-per-user-per-min: ${RL_INVITE_JOIN_USER:10}
    invite-join-per-ip-per-min: ${RL_INVITE_JOIN_IP:20}
    auth-per-ip-per-min: ${RL_AUTH_IP:20}
    geocode-per-user-per-min: ${RL_GEOCODE_USER:20}         # 합주실 등록/수정 시 네이버 지오코딩 호출 계정당 분당 상한
    media-upload-per-user-per-min: ${RL_MEDIA_UPLOAD_USER:30}   # 게시글 첨부 업로드 URL 발급 계정당 분당 상한
    report-per-user-per-min: ${RL_REPORT_USER:10}               # 신고 접수 계정당 분당 상한
    device-token-per-user-per-min: ${RL_DEVICE_TOKEN_USER:30}   # 디바이스 토큰 등록 계정당 분당 상한
