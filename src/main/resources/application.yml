spring:
  application:
    name: bandapp
  autoconfigure:
    # 이메일 로그인은 passwordEncoder.matches()로 직접 처리한다. 이 자동설정이 켜져 있으면
    # 스프링이 부팅 때마다 임의 비밀번호를 로그에 찍는다.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bandapp}
    username: ${DB_USERNAME:bandapp}
    password: ${DB_PASSWORD:bandapp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:}                       # 기본값 없음 — 미설정 시 기동 실패(의도)
    issuer: bandapp
    access-token-ttl: ${JWT_ACCESS_TTL:PT30M}    # 30분
    refresh-token-ttl: ${JWT_REFRESH_TTL:P14D}   # 14일 (슬라이딩)
  kakao:
    api-base-url: https://kapi.kakao.com
    app-id: ${KAKAO_APP_ID:}
    admin-key: ${KAKAO_ADMIN_KEY:}
    connect-timeout: PT2S
    read-timeout: PT3S
  withdrawal:
    retention-days: ${WITHDRAWAL_RETENTION_DAYS:90}
    purge-cron: ${WITHDRAWAL_PURGE_CRON:0 30 4 * * *}
    purge-zone: Asia/Seoul
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
