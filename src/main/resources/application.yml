spring:
  application:
    name: bandapp
  autoconfigure:
    # 이메일 로그인은 passwordEncoder.matches()로 직접 처리한다. 이 자동설정이 켜져 있으면
    # 스프링이 부팅 때마다 임의 비밀번호를 로그에 찍는다.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bandapp}
    username: ${DB_USERNAME:bandapp}
    password: ${DB_PASSWORD:bandapp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # 운영에서는 prod 프로파일이 이 둘을 false 로 덮어 API 명세 노출을 막는다(application-prod.yml).
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:}                       # 기본값 없음 — 미설정 시 기동 실패(의도)
    issuer: bandapp
    access-token-ttl: ${JWT_ACCESS_TTL:PT30M}    # 30분
    refresh-token-ttl: ${JWT_REFRESH_TTL:P14D}   # 14일 (슬라이딩)
  kakao:
    api-base-url: https://kapi.kakao.com
    app-id: ${KAKAO_APP_ID:}
    admin-key: ${KAKAO_ADMIN_KEY:}
    connect-timeout: PT2S
    read-timeout: PT3S
  naver:
    api-base-url: https://maps.apigw.ntruss.com                 # NCP 콘솔이 안내하는 주소로 코드 수정 없이 교체 가능
    client-id: ${NAVER_MAP_CLIENT_ID:}                          # 비우면 지오코딩만 건너뛰고 좌표 없이 등록된다
    client-secret: ${NAVER_MAP_CLIENT_SECRET:}
    connect-timeout: PT2S
    read-timeout: PT3S
  withdrawal:
    retention-days: ${WITHDRAWAL_RETENTION_DAYS:90}
    purge-cron: ${WITHDRAWAL_PURGE_CRON:0 30 4 * * *}
    purge-zone: Asia/Seoul
  recurring:
    zone: Asia/Seoul                                     # 정기 규칙의 요일·시각을 해석하는 기준 시간대
    horizon-weeks: ${RECURRING_HORIZON_WEEKS:8}          # 미리 만들어 둘 기간 (BUILD_PLAN "향후 8주분")
    extend-cron: ${RECURRING_EXTEND_CRON:0 0 5 * * *}    # 매일 05:00 KST 회차 이어 만들기 배치
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  deeplink:
    base-url: ${DEEPLINK_BASE_URL:http://localhost:8080}    # 초대 링크·랜딩 페이지 공개 주소
    scheme: ${DEEPLINK_SCHEME:bandapp}                       # 앱 커스텀 스킴 (bandapp://invite/CODE)
    ios-app-id: ${IOS_APP_ID:}                               # 예: TEAMID.com.yeka.bandapp (AASA 검증용)
    ios-app-store-url: ${IOS_APP_STORE_URL:https://apps.apple.com/app/id0000000000}
    android-package: ${ANDROID_PACKAGE:com.yeka.bandapp}
    android-play-store-url: ${ANDROID_PLAY_STORE_URL:https://play.google.com/store/apps/details?id=com.yeka.bandapp}
    android-sha256-cert-fingerprints: ${ANDROID_SHA256_CERT_FINGERPRINTS:}   # 쉼표 구분, assetlinks.json 검증용
  ratelimit:
    invite-join-per-user-per-min: ${RL_INVITE_JOIN_USER:10}
    invite-join-per-ip-per-min: ${RL_INVITE_JOIN_IP:20}
    auth-per-ip-per-min: ${RL_AUTH_IP:20}
    geocode-per-user-per-min: ${RL_GEOCODE_USER:20}         # 합주실 등록/수정 시 네이버 지오코딩 호출 계정당 분당 상한
