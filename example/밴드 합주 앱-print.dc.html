<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<meta name="omelette-print-source" content="v1788103380940719 밴드 합주 앱.dc.html">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="./doc-page.js"></script>
<style>
*{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box}
*{animation-delay:-99s !important;animation-duration:.001s !important;animation-iteration-count:1 !important;animation-fill-mode:both !important;animation-play-state:running !important;transition-duration:0s !important}
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif}
doc-page:not(:defined){visibility:hidden}
a{color:#FF6A2B}a:hover{color:#FF8B5C}
</style>
</helmet>

<doc-page size="letter" content-width="1120px" content-height="1449px">
<sc-for list="{{ pages }}" as="pg" hint-placeholder-count="9">
<section class="page" style="background:#0B0B0E;color:#F2F0EC;padding:64px 60px;display:flex;flex-direction:column">
<div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:18px">
<div style="display:flex;align-items:baseline;gap:14px">
<div style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.2em;color:#FF6A2B">STAGE ON</div>
<div style="font-size:16px;font-weight:700">합주실 예약 · 일정 관리 앱 화면 정의서</div>
</div>
<div style="font-family:'JetBrains Mono','Noto Sans KR',monospace;font-size:14px;color:rgba(242,240,236,.45)">{{ pg.pageNo }}</div>
</div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;gap:72px;padding-top:40px">
<sc-for list="{{ pg.items }}" as="s" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;align-items:center;gap:18px">
<div style="display:flex;align-items:baseline;gap:10px">
<div style="font-family:'JetBrains Mono','Noto Sans KR',monospace;font-size:15px;font-weight:700;color:#FF6A2B">{{ s.num }}</div>
<div style="font-size:19px;font-weight:800;letter-spacing:-.01em">{{ s.label }}</div>
</div>
<div style="font-size:13.5px;color:rgba(242,240,236,.5);text-align:center;max-width:400px;line-height:1.6;min-height:44px">{{ s.desc }}</div>
<dc-import name="BandScreen" screen="{{ s.key }}" hint-size="402px,874px" style="width:402px;height:874px"></dc-import>
</div>
</sc-for>
</div>
</section>
</sc-for>
</doc-page>

</x-dc>
<script type="text/x-dc" data-dc-script>
const SCREENS = [
  ['splash', '스플래시 · 로딩', '앱 실행 시 앱명·아이콘과 로딩 바를 2초간 노출한 뒤 로그인으로 이동.'],
  ['login', '로그인 · 회원가입', '카카오 / 네이버 / Google 소셜 로그인, 자동 로그인 토글.'],
  ['terms', '약관 동의', '회원가입 단계의 필수·선택 약관 동의 (개인정보처리방침 포함).'],
  ['start', '밴드 생성 / 가입', '밴드장으로 새 밴드를 만들거나 초대코드로 기존 밴드에 합류.'],
  ['create', '밴드 만들기', '밴드 이름·장르·내 파트 입력, 초대코드 자동 발급.'],
  ['join', '초대코드 가입', '초대코드 6자리 입력 후 내 파트 선택.'],
  ['home', '밴드 홈', '멤버 목록, 다음 합주 카드, 정산 요약, 다가오는 일정. 알림 벨 · 밴드 전환.'],
  ['cal', '예약 캘린더', '월/주 전환, 예약 있는 날 표시, 날짜별 예약 목록, 정기 합주 진입.'],
  ['map', '합주실 지도', '즐겨찾는 합주실 마커, 선택 시 가격·옵션 시트에서 바로 예약.'],
  ['detail', '예약 상세', '예약 정보와 승인 대기 상태, 참석 멤버, 메모.'],
  ['cancel', '예약 변경 · 취소', '예약자와 밴드장만 가능. 취소 사유와 납부금 이월 · 위약금 안내.'],
  ['split', '정산 (N빵)', '전체 / 참석자 기준 분배 전환, 1인 금액과 납부 체크리스트.'],
  ['board', '게시판', '합주 사진·영상 피드, 그리드 전환, 좋아요·댓글.'],
  ['notif', '알림 센터 · 설정', '취소 · 정산 · 가입 · 리마인더 · 승인 알림과 이벤트별 수신 설정.'],
  ['members', '멤버 관리 · 위임', '역할 배지, 밴드장 위임 / 추방, 초대코드 재발급, 밴드 나가기.'],
  ['repeat', '정기 예약', '반복 요일·시간·종료 규칙으로 정기 합주 일괄 등록 (PRO).'],
  ['premium', '프리미엄', '밴드 단위 월 구독, 잠긴 기능 PRO 배지.'],
];

class Component extends DCLogic {
  renderVals() {
    const items = SCREENS.map(([key, label, desc], i) => ({ key, label, desc, num: String(i + 1).padStart(2, '0') }));
    const pages = [];
    for (let i = 0; i < items.length; i += 2) {
      pages.push({ items: items.slice(i, i + 2), pageNo: (pages.length + 1) + ' / ' + Math.ceil(items.length / 2) });
    }
    return { pages };
  }
}

</script>
</body>
</html>
